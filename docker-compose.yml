services:
  db:
    image: postgres:16
    container_name: hirelens_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: HireLensDb
    ports:
      - "5433:5432" # host 5433 to avoid clashing with other local Postgres instances
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d HireLensDb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend/HireLens.API
    container_name: hirelens_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=HireLensDb;Username=postgres;Password=postgres"
      # Read from your shell or a root .env file (not committed)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "5297:8080"
    profiles: ["api"] # start with: docker compose --profile api up --build

volumes:
  pgdata:
